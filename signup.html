<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In / Sign Up</title>
    <!-- Use the Inter font from stylesheet -->
    <link rel="stylesheet" href="style.css">
    
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="header">
        <!-- Header for the form -->
        <h1 id="form-title" class="text-3xl font-bold text-center text-gray-800 mb-6">Signup For Unimart</h1>

        <!-- Sign Up Form Section -->
        <form id="signup-form" class="space-y-6">
            <!-- Full Name Input -->
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700">Official Name</label>
                <input type="text" id="name" name="name" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-purple-500 focus:border-purple-500 transition duration-150 ease-in-out">
            </div>

            <!-- Username Input -->
            <div>
                <label for="username_signup" class="block text-sm font-medium text-gray-700">Username</label>
                <input type="text" id="username_signup" name="username_signup" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-purple-500 focus:border-purple-500 transition duration-150 ease-in-out">
            </div>

        
            <!-- Password and Confirm Password -->
            <div>
                <label for="password_signup" class="block text-sm font-medium text-gray-700">Create a Password</label>
                <input type="password" id="password_signup" name="password_signup" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-purple-500 focus:border-purple-500 transition duration-150 ease-in-out">
                <p id="password-requirements" class="mt-1 text-xs text-gray-500">8+ characters, with numbers, letters, and a special character.</p>
            </div>
            <div>
                <label for="confirm_password" class="block text-sm font-medium text-gray-700">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-purple-500 focus:border-purple-500 transition duration-150 ease-in-out">
            </div>

            

           

            <!-- Terms and Conditions Checkbox -->
            <div class="flex items-start">
                <div class="flex items-center h-5">
                    <input id="terms" name="terms" type="checkbox" required class="focus:ring-purple-500 h-4 w-4 text-purple-600 border-gray-300 rounded">
                </div>
                <div class="ml-3 text-sm">
                    <label for="terms" class="font-medium text-gray-700">I agree to the <a href="#" class="text-purple-600 hover:text-purple-500 font-semibold">Terms and Conditions</a></label>
                </div>
            </div>

            <!-- Signup Button -->
            <div>
                <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-xl shadow-sm text-sm font-medium text-white bg-purple-600 hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500 transition duration-150 ease-in-out">
                    Sign Up
                </button>
            </div>

            <!-- Switch to Login -->
            <div class="text-center">
                <p class="text-sm text-gray-600">Already have an account? <a href="#" id="show-login" class="text-purple-600 hover:text-purple-500 font-semibold">Log in</a></p>
            </div>
        </form>
        <div id="message-box" class="mt-4 p-3 hidden rounded-xl text-center font-medium"></div>

        <!-- Sign In Form Section (initially hidden) -->
        <form id="login-form" class="space-y-6 hidden">
            <!-- Username Input -->
            <div>
                <label for="username_login" class="block text-sm font-medium text-gray-700">Username</label>
                <input type="text" id="username_login" name="username_login" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-purple-500 focus:border-purple-500 transition duration-150 ease-in-out">
            </div>

            <!-- Password Input -->
            <div>
                <label for="password_login" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password_login" name="password_login" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-purple-500 focus:border-purple-500 transition duration-150 ease-in-out">
            </div>

            <!-- Login Button -->
            <div>
                <a href="buyer-explore.html" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-xl shadow-sm text-sm font-medium text-white bg-purple-600 hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500 transition duration-150 ease-in-out">
    Log In
</a>
                
            </div>

            <!-- Switch to Sign Up -->
            <div class="text-center">
                <p class="text-sm text-gray-600">Don't have an account? <a href="#" id="show-signup" class="text-purple-600 hover:text-purple-500 font-semibold">Sign up</a></p>
            </div>
        </form>
        
        <!-- General message box for errors or success messages -->
        <div id="message-box" class="mt-4 p-3 hidden rounded-xl text-center font-medium"></div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const signupForm = document.getElementById('signup-form');
            const loginForm = document.getElementById('login-form');
            const formTitle = document.getElementById('form-title');
            const showLoginBtn = document.getElementById('show-login');
            const showSignupBtn = document.getElementById('show-signup');
            const passwordSignup = document.getElementById('password_signup');
            const confirmPassword = document.getElementById('confirm_password');
            const phoneInput = document.getElementById('phone');
            const messageBox = document.getElementById('message-box');

            // Function to show a message in the message box
            const showMessage = (message, type) => {
                messageBox.textContent = message;
                messageBox.classList.remove('hidden', 'bg-green-100', 'text-green-700', 'bg-red-100', 'text-red-700');
                if (type === 'success') {
                    messageBox.classList.add('bg-green-100', 'text-green-700');
                } else if (type === 'error') {
                    messageBox.classList.add('bg-red-100', 'text-red-700');
                }
            };

            // Toggle between Sign Up and Sign In forms
            const switchToLogin = (event) => {
                if (event) event.preventDefault();
                signupForm.classList.add('hidden');
                loginForm.classList.remove('hidden');
                formTitle.textContent = 'Log In to Your Account';
            };

            const switchToSignup = (event) => {
                if (event) event.preventDefault();
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                formTitle.textContent = 'Create Your Account';
            };

            showLoginBtn.addEventListener('click', switchToLogin);
            showSignupBtn.addEventListener('click', switchToSignup);

           

            // Handle the Sign Up form submission
            signupForm.addEventListener('submit', (event) => {
                event.preventDefault(); // Prevent default form submission

                // Password validation
                const passwordValue = passwordSignup.value;
                const confirmPasswordValue = confirmPassword.value;
                const passwordRegex = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
                if (!passwordRegex.test(passwordValue)) {
                    showMessage('Password must be at least 8 characters and contain at least one letter, one number, and one special character.', 'error');
                    return;
                }
                if (passwordValue !== confirmPasswordValue) {
                    showMessage('Passwords do not match.', 'error');
                    return;
                }
                
                // Phone number validation
              
                // All validations passed, simulate successful signup and switch to login
                showMessage('Sign Up Successful! Please log in with your new credentials.', 'success');
                setTimeout(() => {
                    switchToLogin();
                    messageBox.classList.add('hidden');
                }, 2000);
            });

            // Handle the Login form submission
            loginForm.addEventListener('submit', (event) => {
                event.preventDefault(); // Prevent default form submission
                
            
                // show a success message.
                showMessage('Login successful!', 'success');
   //log it to the console.
                console.log('Login attempt successful.');
            });
        });
    </script>

</body>
</html>
